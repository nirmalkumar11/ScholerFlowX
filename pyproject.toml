[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-paper-ai"
version = "1.0.0"
description = "AI-assisted research paper formatting service"
requires-python = ">=3.11,<3.14"
dependencies = [
  "crewai==1.14.7",
  "litellm==1.89.3",
  "flask==3.1.3",
  "flask-cors==6.0.5",
  "python-dotenv>=1.2.2,<2",
  "requests>=2.32,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
